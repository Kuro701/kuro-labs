  /* ===========================================================================
     MAIN MENU -- v1, built once Kuro's own ChatGPT ship/planet render landed
     (assets/menu_bg.jpg). Per his note this pass ("something in the style of
     the game... and as separate button not square in middle"): the previous
     logic-test harness put everything in one plain centered card, which reads
     like a web form, not a game menu, and isn't the site's visual language at
     all. This version drops that card entirely -- the background art fills
     the whole screen, and each control (New Game, Play, the recovery-code
     box) is its own separate angular sci-fi panel positioned in the scene,
     beveled corners cut with clip-path, in the same black/red gothic palette
     and corner-bracket "showcase" framing already established on the
     gameplay page, so the menu and the game read as one continuous UI system
     rather than two different apps stapled together.
     =========================================================================== */

  #menu{ position:fixed; inset:0; overflow:hidden; }

  /* ---------------------------------------------------------------------------
     LIVING BACKGROUND, per Kuro's follow-up ("ship to spin... oh wait, planet
     to spin, not the ship... asteroids moving around, some movement to feel
     alive"). First pass tried to actually rotate the planet: hand-cut it out
     of the source photo into its own layer, with the hole in the base image
     patched by a blurred/darkened copy of itself. That technique kept failing
     in practice -- the hand-traced outline never hugged the real planet limb
     closely enough, so a large real chunk of the planet's lit surface fell
     outside the cutout and rendered as the dark blurred patch instead of the
     actual art (that's the big flat dark area Kuro flagged as "ehhhh"), on
     top of a hard rectangular notch and a couple of stray disconnected dark
     islands in the mask itself. This is a single static photo, not a 3D
     scene, so a truly clean rotating cutout isn't reliably achievable by hand
     -- simplified instead to the two effects that don't depend on cutting
     anything out of the photo at all: a slow Ken Burns zoom/pan on the whole
     image for overall "alive" drift, plus independent CSS-drawn asteroids on
     top (not cut from the art) drifting and tumbling across the scene. No
     literal planet spin, but no seams or holes either.
     --------------------------------------------------------------------------- */
  #bgWrap{ position:absolute; inset:-4%; animation:kenBurns 34s ease-in-out infinite alternate; }
  @keyframes kenBurns{ 0%{ transform:scale(1) translate(0,0); } 100%{ transform:scale(1.12) translate(-2.2%, -1.4%); } }

  /* ---------------------------------------------------------------------------
     CLOUD DRIFT + SHIP LIGHT FLICKER, per Kuro's follow-up once the asteroids
     were visible ("clouds movement on the planet and some light flickering on
     the ship... make the whole photo look more alive"). Same safety rule as
     everything else in this background: nothing is cut out of the actual
     photo. Clouds are soft blurred white blobs laid over the real cloud bands
     in the art, blended with mix-blend-mode:screen so they brighten/thicken
     what's already there instead of painting a flat patch, then drifted +
     breathed slowly. Ship lights are small radial-gradient glows placed over
     the engine and hull lights already in the render, also screen-blended,
     flickering on independent irregular keyframes (not a smooth pulse) so
     they read as lights, not a heartbeat. Positions are hand-picked percentages
     against the source photo (1672x941) -- approximate, not pixel-exact, which
     is fine since these are soft glows, not hard-edged cutouts; they live
     inside #bgWrap so they pan/zoom together with the Ken Burns effect and
     stay roughly locked to the art underneath it.
     --------------------------------------------------------------------------- */
  #lifeLayer{ position:absolute; inset:0; pointer-events:none; }

  .cloudWisp{ position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.85) 0%, rgba(255,255,255,.35) 40%, rgba(255,255,255,0) 72%);
    filter:blur(14px); mix-blend-mode:screen; animation:cloudDrift ease-in-out infinite; }
  @keyframes cloudDrift{
    0%   { transform:translate(calc(-50% - 26px), -50%) scale(1);            opacity:.5; }
    50%  { transform:translate(calc(-50% + 22px), calc(-50% - 14px)) scale(1.08); opacity:.8; }
    100% { transform:translate(calc(-50% - 26px), -50%) scale(1);            opacity:.5; }
  }

  .shipGlow{ position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
    transform:translate(-50%,-50%); }
  .shipGlow.main{ background:radial-gradient(circle, rgba(255,140,70,.95) 0%, rgba(255,70,25,.55) 42%, rgba(255,30,10,0) 72%);
    filter:blur(5px); animation:engineFlicker 2.6s ease-in-out infinite; }
  .shipGlow.small{ background:radial-gradient(circle, rgba(255,160,100,.9) 0%, rgba(255,70,25,.45) 50%, rgba(255,30,10,0) 78%);
    filter:blur(2.5px); animation:windowFlicker 4.4s ease-in-out infinite; }
  @keyframes engineFlicker{
    0%{opacity:.75} 10%{opacity:.5} 20%{opacity:.95} 35%{opacity:.6}
    50%{opacity:1} 65%{opacity:.55} 80%{opacity:.9} 100%{opacity:.75}
  }
  @keyframes windowFlicker{
    0%,100%{opacity:.7} 10%{opacity:.25} 13%{opacity:.7} 45%{opacity:.55}
    48%{opacity:1} 70%{opacity:.35} 74%{opacity:.75}
  }

  .asteroid{ position:absolute; background:linear-gradient(135deg,#3a3532,#151212 65%);
    box-shadow:inset -2px -3px 4px rgba(0,0,0,.6), inset 1px 1px 2px rgba(200,190,180,.25);
    opacity:.85; will-change:transform; }

  /* dark scrim, heavier toward the bottom-left where the controls sit, so
     they stay legible against a bright render without flattening the art */
  #scrim{ position:absolute; inset:0; z-index:2;
    background:
      radial-gradient(ellipse 900px 700px at 8% 92%, rgba(7,5,6,.92) 0%, rgba(7,5,6,.55) 45%, rgba(7,5,6,0) 72%),
      linear-gradient(180deg, rgba(7,5,6,.55) 0%, rgba(7,5,6,0) 20%, rgba(7,5,6,0) 60%, rgba(7,5,6,.65) 100%); }

  .corner{ position:absolute; width:34px; height:34px; border:2px solid rgba(var(--blood),.65);
    pointer-events:none; z-index:5; }
  .corner.tl{ top:14px; left:14px; border-right:none; border-bottom:none; }
  .corner.tr{ top:14px; right:14px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:14px; left:14px; border-right:none; border-top:none; }
  .corner.br{ bottom:14px; right:14px; border-left:none; border-top:none; }

  #titleBlock{ position:absolute; top:8%; left:50%; transform:translateX(-50%); text-align:center;
    z-index:4; }
  #titleBlock h1{ margin:0; font-family:var(--display); font-size:clamp(2.2rem, 5vw, 3.6rem);
    letter-spacing:.04em; color:var(--ash); text-shadow:0 0 18px rgba(var(--ember),.75), 0 0 46px rgba(var(--ember),.35), 0 2px 3px #000; }
  #titleBlock .tag{ margin-top:6px; font-family:var(--head); font-size:.78rem; letter-spacing:.32em;
    color:var(--dust); text-transform:uppercase; }

  /* --- controls cluster, bottom-left, each piece its own separate panel --- */
  #controls{ position:absolute; left:5%; bottom:9%; z-index:4; display:flex; flex-direction:column;
    gap:16px; width:min(360px, 84vw); }

  .panelBtn{ position:relative; display:block; width:100%; text-align:left; cursor:pointer;
    font-family:var(--head); font-size:1rem; letter-spacing:.14em; text-transform:uppercase;
    padding:16px 22px; color:var(--dust); background:linear-gradient(135deg, rgba(16,10,11,.88), rgba(16,10,11,.68));
    border:1px solid rgba(var(--blood),.55);
    clip-path:polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    transition:color .15s, border-color .15s, box-shadow .15s, transform .1s; }
  .panelBtn::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:rgba(var(--blood),.6); }
  .panelBtn .sub{ display:block; margin-top:3px; font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:.68rem; letter-spacing:.03em; text-transform:none; color:var(--dust); opacity:.8; }
  .panelBtn:hover{ color:#fff; border-color:rgb(var(--ember)); }
  .panelBtn:active{ transform:translateY(1px); }
  .panelBtn:disabled{ opacity:.4; cursor:not-allowed; }
  .panelBtn:disabled:hover{ color:var(--dust); border-color:rgba(var(--blood),.55); }

  .panelBtn.glow{ color:#fff; border-color:rgb(var(--ember));
    background:linear-gradient(135deg, rgba(70,14,12,.92), rgba(30,10,10,.85));
    box-shadow:0 0 22px rgba(var(--ember),.55), inset 0 0 18px rgba(var(--ember),.18);
    animation:pulseGlow 2.4s ease-in-out infinite; }
  .panelBtn.glow::before{ background:rgb(var(--ember)); box-shadow:0 0 8px rgb(var(--ember)); }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 22px rgba(var(--ember),.55), inset 0 0 18px rgba(var(--ember),.18); }
    50%{ box-shadow:0 0 34px rgba(var(--ember),.85), inset 0 0 24px rgba(var(--ember),.3); }
  }

  /* recovery-code panel -- deliberately its own separate shape, offset from
     the two main buttons, not merged into the same card */
  #recoverPanel{ margin-top:6px; padding:14px 18px; background:rgba(16,10,11,.72);
    border:1px solid rgba(var(--blood),.4);
    clip-path:polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px); }
  #recoverPanel .label{ font-family:var(--head); font-size:.68rem; letter-spacing:.2em;
    text-transform:uppercase; color:var(--dust); margin-bottom:8px; }
  .codeRow{ display:flex; gap:8px; }
  .codeRow input{ flex:1; min-width:0; padding:9px 10px; background:var(--coal); color:var(--ash);
    border:1px solid rgba(var(--blood),.4); font-size:.85rem; font-family:ui-monospace,monospace;
    letter-spacing:.05em; }
  .codeRow input::placeholder{ color:var(--dust); font-family:ui-sans-serif,system-ui,sans-serif; }
  .codeRow button{ flex:0 0 auto; padding:9px 16px; background:var(--crypt); color:var(--dust);
    border:1px solid rgba(var(--blood),.55); font-family:var(--head); font-size:.72rem;
    letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  .codeRow button:hover{ color:#fff; border-color:rgb(var(--ember)); }

  #msgLine{ margin-top:10px; font-size:.78rem; line-height:1.5; padding-left:10px;
    border-left:2px solid transparent; display:none; }
  #msgLine.error{ display:block; border-color:rgb(var(--ember)); color:#ffb3ab; }
  #msgLine.success{ display:block; border-color:#5cc26a; color:#c3f0c8; }
  #msgLine a{ color:#fff; text-decoration:underline; }

  #footNote{ position:absolute; right:18px; bottom:14px; z-index:4; font-size:.68rem;
    color:var(--dust); letter-spacing:.06em; opacity:.75; }
</style>
</head>

   sibling file, so there's now nothing for it to fail to find. Behavior is
   unchanged: this is still the FRONT-END STUB Kuro picked for this pass -- the
   full state machine for the main-menu flow (glowing Play vs. New Game, the
   recovery code box, the error state) works completely today, driven by
   localStorage standing in for the real save. No server exists yet. Swapping
   in the real backend later (the shared Ad Games Cloudflare Workers + D1
   service, per ALIEN_DRONE_ROGUELITE.md's "Identity" section) means replacing
   the functions in the "BACKEND STUB" section below with real fetch() calls --
   nothing in the state machine or the UI wiring below needs to change, since
   they only ever call getActiveSave/setActiveSave/lookupCode/startNewGame.

   Kuro's spec, restated as the exact rules this file implements:
   - If this browser already has a save ("remembers last gameplay"): Play
     glows (primary). New Game does not.
   - If not: New Game glows (primary) instead. Play does not (and is inert
     until a save exists, from New Game or a recovered code).
   - Recovery-code box: enter a code, submit ("click through").
     - Code matches real data -> that save becomes this browser's active
       save, Play now glows.
     - Code doesn't match anything -> on-screen error: "please contact my
       Discord account so I can sort it out," with a real link.
   ============================================================================= */

const DOS_STORAGE_KEY = 'dos_active_save';      // this browser's current save
const DOS_STUB_DB_KEY = 'dos_stub_recovery_db'; // fake "server" of issued codes, stub only
const DOS_DISCORD_URL = 'https://discord.gg/yhQGRDBEzM'; // same invite already used for Mytheder; swap if Kuro wants a dedicated one

/* ---------------------------------------------------------------------------
   BACKEND STUB -- the only section that needs to change when the real
   Workers+D1 identity service exists. Everything else in this file, and all
   UI code built against it, stays the same.
--------------------------------------------------------------------------- */
function getActiveSave(){
  try {
    const raw = localStorage.getItem(DOS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function setActiveSave(save){
  try { localStorage.setItem(DOS_STORAGE_KEY, JSON.stringify(save)); } catch (e) {}
}

function clearActiveSave(){
  try { localStorage.removeItem(DOS_STORAGE_KEY); } catch (e) {}
}

// Fake "server" lookup. Real version: POST the code to the backend, get back
// the save row or a 404. Stub version: reads a fake table also kept in this
// same browser's localStorage, seeded with a couple of test codes below so
// the valid/invalid paths are both actually testable without a server.
function lookupCode(code){
  const db = _readStubDb();
  const key = _normalizeCode(code);
  return db[key] || null;
}

function _normalizeCode(code){
  return String(code || '').trim().toUpperCase();
}

function _readStubDb(){
  try {
    const raw = localStorage.getItem(DOS_STUB_DB_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  // Seed a couple of fixtures on first run so there's something valid to
  // test against. Real backend: this whole seeding block goes away.
  const seeded = {
    'TEST-CODE-1': { code: 'TEST-CODE-1', floor: 3, createdAt: Date.now() - 86400000 },
    'HIVE-SAVED-2': { code: 'HIVE-SAVED-2', floor: 1, createdAt: Date.now() - 3600000 },
  };
  try { localStorage.setItem(DOS_STUB_DB_KEY, JSON.stringify(seeded)); } catch (e) {}
  return seeded;
}

/* ---------------------------------------------------------------------------
   STATE MACHINE -- this part is backend-agnostic and is the part that
   survives the swap to a real server unchanged.
--------------------------------------------------------------------------- */

// Fresh save with no recovery code yet -- per the already-decided design
// (ALIEN_DRONE_ROGUELITE.md), the code isn't issued until the FIRST hive
// clear, not at game start, so New Game must not fabricate one.
function startNewGame(){
  const save = { code: null, floor: 0, createdAt: Date.now() };
  setActiveSave(save);
  return save;
}

// Attempt to recover a save from a typed-in code.
// Returns { ok: true, save } or { ok: false, error: 'not_found' }.
function tryRecoverCode(code){
  const found = lookupCode(code);
  if (!found) return { ok: false, error: 'not_found' };
  setActiveSave(found);
  return { ok: true, save: found };
}

// The single source of truth for what the menu should show. Call this on
// load and after every action; feed the result straight into the UI.
function getMenuState(){
  const save = getActiveSave();
  return {
    hasSave: !!save,
    save,
    playGlows: !!save,
    newGameGlows: !save,
  };
}

// Exposed for the UI code below (and the harness page) to wire up without
// reaching into localStorage directly.
window.DOS_MENU = {
  DOS_DISCORD_URL,
  getMenuState,
  startNewGame,
  tryRecoverCode,
  clearActiveSave,
  // test-only helpers, not part of the real interface
  _debug_seedValidCode: 'TEST-CODE-1',
  _debug_readStubDb: _readStubDb,
};

/* ---------------------------------------------------------------------------
   UI WIRING
--------------------------------------------------------------------------- */
const btnNewGame = document.getElementById('btnNewGame');
const btnPlay = document.getElementById('btnPlay');
const btnRecover = document.getElementById('btnRecover');
const codeInput = document.getElementById('codeInput');
const msgLine = document.getElementById('msgLine');

function showMessage(kind, html){
  msgLine.className = kind;
  msgLine.innerHTML = html;
}
function clearMessage(){
  msgLine.className = '';
  msgLine.innerHTML = '';
}

function render(){
  const s = window.DOS_MENU.getMenuState();
  btnNewGame.classList.toggle('glow', s.newGameGlows);
  btnPlay.classList.toggle('glow', s.playGlows);
  btnPlay.disabled = !s.playGlows;
}

btnNewGame.addEventListener('click', () => {
  window.DOS_MENU.startNewGame();
  clearMessage();
  render();
});

btnPlay.addEventListener('click', () => {
  const s = window.DOS_MENU.getMenuState();
  if (!s.playGlows) return;
  // Real flow per Kuro's design: Play drops the clone into the ship interior
  // (cloning station / armory / shop hub), which is where Shop/Armory/"into
  // the hive" navigation will live once that scene is built. The hive
  // (movement + floor traversal prototype) now lives at ../hive/ -- the ship
  // hub links to it directly for now until the real hub UI replaces this stub.
  window.location.href = 'ship/';
});

btnRecover.addEventListener('click', () => {
  const code = codeInput.value;
  const result = window.DOS_MENU.tryRecoverCode(code);
  if (result.ok){
    showMessage('success', 'Save recovered — Play is ready.');
  } else {
    showMessage('error',
      'That code doesn\'t match any saved data. Please contact me on ' +
      '<a href="' + window.DOS_MENU.DOS_DISCORD_URL + '" target="_blank" rel="noopener">Discord</a> so I can sort it out.');
  }
  render();
});

render();

/* ---------------------------------------------------------------------------
   Drifting asteroids -- new independent shapes, not extracted from the photo
   (much safer than trying to detach the ones already baked into the art).
   First pass on these was too subtle to read as motion at all -- small, slow,
   and round enough that Kuro read them as "small planets" sitting still
   rather than debris drifting by. Reworked to actually be seen: bigger size
   range, much larger drift distances covered in well under a minute, a
   lumpier/more jagged silhouette (clip-path instead of a near-circular
   border-radius) so they read as rocks and not planets, and duration varies
   per rock so they don't sync up.
--------------------------------------------------------------------------- */
(function initAsteroids(){
  const field = document.getElementById('asteroidField');
  const styleEl = document.createElement('style');
  document.head.appendChild(styleEl);

  const rocks = [
    { top: '8%',  left: '55%', size: 22, drift: [180, -70],  rot: 130, dur: 19 },
    { top: '22%', left: '80%', size: 15, drift: [-220, 90],  rot: -160, dur: 24 },
    { top: '4%',  left: '30%', size: 20, drift: [130, 160],  rot: 110, dur: 17 },
    { top: '62%', left: '88%', size: 30, drift: [-160, -110], rot: -140, dur: 27 },
    { top: '35%', left: '8%',  size: 14, drift: [170, 60],   rot: 200, dur: 15 },
    { top: '15%', left: '96%', size: 24, drift: [-190, 130],  rot: -120, dur: 22 },
    { top: '48%', left: '66%', size: 12, drift: [110, -170],  rot: 160, dur: 14 },
    { top: '30%', left: '45%', size: 18, drift: [-140, 100],  rot: -180, dur: 20 },
    { top: '55%', left: '20%', size: 26, drift: [150, -90],   rot: 150, dur: 25 },
  ];

  rocks.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'asteroid';
    const animName = 'astDrift' + i;
    el.style.top = r.top;
    el.style.left = r.left;
    el.style.width = r.size + 'px';
    el.style.height = Math.round(r.size * 0.82) + 'px';
    el.style.clipPath = 'polygon(20% 0%, 60% 8%, 100% 30%, 92% 68%, 68% 100%, 28% 96%, 0% 62%, 6% 22%)';
    el.style.animation = `${animName} ${r.dur}s ease-in-out infinite alternate`;
    field.appendChild(el);

    styleEl.appendChild(document.createTextNode(`
      @keyframes ${animName} {
        0%   { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(${r.drift[0]}px, ${r.drift[1]}px) rotate(${r.rot}deg); }
      }
    `));
  });
})();
</script>
</body>
</html>
