  /* ===========================================================================
     ARMORY -- first sub-room off the ship hub, built the same way the cloning
     bay was: Kuro's own render (assets/armory.jpg) with hotspots laid directly
     on the real features -- the equip pedestal, the weapon rack, the armor
     rack, the loadout screen -- rather than generic tiles. Nothing here is a
     real system yet (no gear/inventory backend exists), so every hotspot is
     "soon" including the pedestal itself; this room exists today so the hub
     ->armory->back chain is real and walkable, and each hotspot just needs its
     href/soon class flipped once that piece is built, same pattern as
     Enter the Hive on the ship page. Same styling system, same lesson learned
     on relative paths -- background inlined as base64.
     =========================================================================== */

  /* soft pulsing bloom over the equip pedestal's ring light -- same
     screen-blend trick used on the cloning pod, nothing cut from the photo */
  .lifeGlow{ position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
    transform:translate(-50%,-50%); }
  .lifeGlow.pedestal{ background:radial-gradient(circle, rgba(180,225,255,.7) 0%, rgba(120,190,255,.28) 45%, rgba(120,190,255,0) 75%);
    filter:blur(12px); animation:podPulse 4.2s ease-in-out infinite; }
  @keyframes podPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  #scrim{ position:absolute; inset:0; z-index:2;
    background:
      radial-gradient(ellipse 1000px 700px at 50% 100%, rgba(7,5,6,.7) 0%, rgba(7,5,6,0) 60%),
      linear-gradient(180deg, rgba(7,5,6,.6) 0%, rgba(7,5,6,0) 22%, rgba(7,5,6,0) 78%, rgba(7,5,6,.5) 100%); }

  .corner{ position:absolute; width:34px; height:34px; border:2px solid rgba(var(--blood),.65);
    pointer-events:none; z-index:6; }
  .corner.tl{ top:14px; left:14px; border-right:none; border-bottom:none; }
  .corner.tr{ top:14px; right:14px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:14px; left:14px; border-right:none; border-top:none; }
  .corner.br{ bottom:14px; right:14px; border-left:none; border-top:none; }

  #titleBlock{ position:absolute; top:5%; left:50%; transform:translateX(-50%); text-align:center; z-index:5; }
  #titleBlock h1{ margin:0; font-family:var(--display); font-size:clamp(1.6rem, 3.4vw, 2.4rem);
    letter-spacing:.04em; color:var(--ash); text-shadow:0 0 16px rgba(var(--ember),.7), 0 2px 3px #000; }
  #titleBlock .tag{ margin-top:4px; font-family:var(--head); font-size:.66rem; letter-spacing:.28em;
    color:var(--dust); text-transform:uppercase; }

  #back{ position:absolute; top:22px; left:22px; z-index:6; font-size:.7rem; letter-spacing:.08em;
    color:var(--dust); text-decoration:none; border-bottom:1px solid rgba(var(--blood),.4); padding-bottom:2px; }
  #back:hover{ color:var(--ash); border-color:rgb(var(--ember)); }

  /* --- hotspots, sized per Kuro's note on the ship page ("bigger and much
     more visible") -- same scale from the start here, not a smaller v1 --- */
  .hotspot{ position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
    align-items:center; z-index:4; text-decoration:none; }
  .hotspot .dot{ width:20px; height:20px; border-radius:50%; background:var(--dust);
    margin-bottom:10px; box-shadow:0 0 10px rgba(180,170,165,.35); animation:dotPulseSoon 2.6s ease-in-out infinite; }
  .hotspot .label{ font-family:var(--head); font-size:.88rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ash); padding:12px 20px; white-space:nowrap;
    background:linear-gradient(135deg, rgba(16,10,11,.94), rgba(16,10,11,.8));
    border:1.5px solid rgba(var(--blood),.65);
    clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
  .hotspot .label .sub{ display:block; margin-top:3px; font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:.66rem; letter-spacing:.02em; text-transform:none; opacity:.8; color:var(--dust); }
  @keyframes dotPulseSoon{ 0%,100%{ box-shadow:0 0 8px rgba(180,170,165,.3); } 50%{ box-shadow:0 0 16px rgba(180,170,165,.55); } }

  .hotspot.soon{ cursor:not-allowed; }
  .hotspot.soon .dot{ background:#a89e9a; opacity:.85; }
  .hotspot.soon .label{ opacity:.82; }

  /* the equip pedestal is the room's main feature -- bigger and bolder than
     the rest, even though it's "soon" too (no gear/character system yet) */
  .hotspot.primary .dot{ width:26px; height:26px; }
  .hotspot.primary .label{ font-size:1.05rem; padding:16px 28px; }
  .hotspot.primary .label .sub{ font-size:.72rem; }

  /* --- resource HUD, same as the ship page --- */
  .hud{ position:absolute; z-index:6; display:flex; flex-direction:column; gap:8px; top:62px; left:22px; }
  .resPill{ display:flex; align-items:center; gap:7px; padding:7px 12px;
    background:linear-gradient(135deg, rgba(16,10,11,.88), rgba(16,10,11,.68));
    border:1px solid rgba(var(--blood),.4);
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    font-family:var(--head); font-size:.72rem; letter-spacing:.04em; color:var(--ash); white-space:nowrap; }
  .resPill .icon{ font-size:.8rem; color:rgb(var(--ember)); text-shadow:0 0 6px rgba(var(--ember),.7); }
  .resPill .val{ font-weight:700; }
  .resPill .lbl{ color:var(--dust); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; margin-left:1px; }
  .spPill{ flex-direction:column; align-items:stretch; width:168px; }
  .spPill .spTop{ display:flex; align-items:center; gap:7px; }
  .spPill .icon{ color:#9fd6ff; text-shadow:0 0 6px rgba(120,190,255,.7); }
  .spPill .barTrack{ width:100%; height:5px; margin-top:6px; background:rgba(255,255,255,.08);
    border:1px solid rgba(var(--blood),.3); overflow:hidden; }
  .spPill .barFill{ height:100%; background:linear-gradient(90deg, rgba(var(--ember),.9), rgba(255,150,90,.9));
    box-shadow:0 0 8px rgba(var(--ember),.6); }
</style>
</head>
<body>

<div id="room">
  <div id="bgWrap">
    <div id="bgBase"></div>
    <div class="lifeGlow pedestal" style="left:28.5%; top:15%; width:260px; height:180px;"></div>
  </div>
  <div id="scrim"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <a id="back" href="../">Back to ship</a>

  <div id="titleBlock">
    <h1>Armory</h1>
    <div class="tag">Equip Bay</div>
  </div>

  <!-- resource HUD, values read from the active save -->
  <div class="hud">
    <div class="resPill"><span class="icon">&#9670;</span><span class="val" id="salvageVal">0</span><span class="lbl">Salvage</span></div>
    <div class="resPill spPill">
      <div class="spTop"><span class="icon">&#9650;</span><span class="val" id="spVal">0</span><span class="lbl">Skill Points</span></div>
      <div class="barTrack"><div class="barFill" id="spBarFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- hotspot: the central equip pedestal -- room's main feature -->
  <div class="hotspot soon primary" style="left:28.5%; top:70%;">
    <span class="dot"></span>
    <span class="label">Equip Loadout<span class="sub">coming soon</span></span>
  </div>

  <!-- hotspot: weapon rack, left wall -->
  <div class="hotspot soon" style="left:4.2%; top:33%;">
    <span class="dot"></span>
    <span class="label">Weapons<span class="sub">coming soon</span></span>
  </div>

  <!-- hotspot: armor rack, right wall -->
  <div class="hotspot soon" style="left:90.2%; top:32.7%;">
    <span class="dot"></span>
    <span class="label">Armor<span class="sub">coming soon</span></span>
  </div>

  <!-- hotspot: the blank loadout/stats screen -->
  <div class="hotspot soon" style="left:60.6%; top:41%;">
    <span class="dot"></span>
    <span class="label">Loadout Stats<span class="sub">coming soon</span></span>
  </div>
</div>

<script>
'use strict';
// Same read as the ship page -- see that file for the full explanation.
(function(){
  var save = null;
  try {
    var raw = localStorage.getItem('dos_active_save');
    if (raw) save = JSON.parse(raw);
  } catch (e) {}
  var salvage = (save && typeof save.salvage === 'number') ? save.salvage : 0;
  var sp = (save && typeof save.skillPoints === 'number') ? save.skillPoints : 0;
  document.getElementById('salvageVal').textContent = salvage.toLocaleString();
  document.getElementById('spVal').textContent = sp.toLocaleString();
  document.getElementById('spBarFill').style.width = Math.max(0, Math.min(100, sp % 100)) + '%';
})();
</script>

</body>
</html>
