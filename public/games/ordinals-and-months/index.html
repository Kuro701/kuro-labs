<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Quest: Ordinals &amp; Months</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a2a66; --muted:#7a6aa8;
    --pink:#ff5fa8; --purple:#8b5cf6; --blue:#33a9f5; --mint:#22c58b; --sun:#ffb81f; --orange:#ff8a3d;
    --line:#eadcff; --good:#1fbf7a; --good-l:#d9f8e9; --bad:#ff7a59; --bad-l:#ffe8e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Fredoka","Baloo 2","Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#ffe3f1 0%,#ebe6ff 45%,#dcf5ff 100%) fixed;
    min-height:100vh; padding:16px; position:relative; overflow-x:hidden;
  }
  #app{max-width:780px;margin:0 auto;position:relative;z-index:1}
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg span{position:absolute;opacity:.55;animation:floaty ease-in-out infinite alternate}
  @keyframes floaty{from{transform:translateY(0) rotate(-8deg) scale(1)}to{transform:translateY(-22px) rotate(10deg) scale(1.12)}}
  h1{
    font-size:clamp(2rem,8vw,3.1rem);margin:.1em 0 .05em;line-height:1.05;font-weight:700;
    background:linear-gradient(90deg,var(--pink),var(--orange),var(--sun),var(--mint),var(--blue),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h2{font-size:1.4rem;margin:.2em 0 .4em;font-weight:700}
  p{line-height:1.5;font-size:1.05rem}
  .muted{color:var(--muted)}
  .card{
    background:rgba(255,255,255,.92);border:3px solid #fff;border-radius:28px;
    padding:20px;margin:14px 0;box-shadow:0 10px 28px rgba(139,92,246,.18);
  }
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .switch{display:flex;align-items:center;gap:14px;font-size:.95rem;color:var(--muted);flex-wrap:wrap}
  .switch input{accent-color:var(--pink);width:18px;height:18px;vertical-align:-3px}

  button{
    font:inherit;cursor:pointer;border:0;color:#fff;font-weight:700;font-size:1.1rem;letter-spacing:.2px;
    padding:12px 24px;border-radius:999px;
    background:linear-gradient(180deg,#b092ff,#8b5cf6);box-shadow:0 5px 0 #6a3fd6;
    transition:transform .08s,filter .15s;
  }
  button:hover{filter:brightness(1.07);transform:translateY(-1px)}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #6a3fd6}
  button:focus-visible,input:focus-visible{outline:4px solid #ffd35a;outline-offset:2px}
  button.ghost{background:#fff;color:#8b5cf6;box-shadow:0 4px 0 var(--line)}
  button.small{padding:8px 16px;font-size:.95rem;box-shadow:0 4px 0 #6a3fd6}
  button.ghost.small{box-shadow:0 4px 0 var(--line)}

  .hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bubble{
    position:relative;background:#fff;border-radius:22px;padding:12px 18px;max-width:420px;
    box-shadow:0 6px 18px rgba(255,95,168,.2);font-size:1.05rem;line-height:1.4;
  }
  .bubble::before{
    content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;
    border-left:0;border-right-color:#fff;
  }
  .mascot{flex:none;filter:drop-shadow(0 6px 8px rgba(255,184,31,.5));animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}

  .menu{display:grid;gap:14px;margin-top:14px}
  .menu button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:16px 24px;border-radius:26px;font-size:1.2rem}
  .menu button small{font-weight:500;opacity:.95;font-size:.9rem}
  .menu .m1{background:linear-gradient(180deg,#ffd45a,#ff9f2e);box-shadow:0 6px 0 #d9781a}
  .menu .m2{background:linear-gradient(180deg,#5fe3b0,#1fbf7a);box-shadow:0 6px 0 #14935a}
  .menu .m3{background:linear-gradient(180deg,#6cc6ff,#3a8dff);box-shadow:0 6px 0 #2565cc}
  .menu .m4{background:linear-gradient(180deg,#ff8cc4,#ff4f9a);box-shadow:0 6px 0 #d02f78}
  .menu .m5{background:linear-gradient(180deg,#b092ff,#7c3aed);box-shadow:0 6px 0 #5b21b6}
  .menu button.ghost{background:#fff;color:#8b5cf6;box-shadow:0 5px 0 var(--line);align-items:center}
  .menu .cA{background:linear-gradient(180deg,#ff9ccc,#ff5fa8);box-shadow:0 6px 0 #d0397a}
  .menu .cB{background:linear-gradient(180deg,#8fd0fb,#33a9f5);box-shadow:0 6px 0 #1f7fc4}
  .menu .cC{background:linear-gradient(180deg,#7fe0b6,#22c58b);box-shadow:0 6px 0 #159463}
  .menu .cD{background:linear-gradient(180deg,#ffd166,#ffb81f);box-shadow:0 6px 0 #d98f0a}
  .menu .cE{background:linear-gradient(180deg,#b9a0ff,#8b5cf6);box-shadow:0 6px 0 #6a3fd6}
  .menu .cF{background:linear-gradient(180deg,#ffb27d,#ff8a3d);box-shadow:0 6px 0 #d9661a}
  .name{
    font:inherit;font-size:1.1rem;padding:10px 16px;border:3px solid var(--line);border-radius:999px;width:100%;max-width:340px;color:var(--ink);background:#fff;
  }

  .bar{height:18px;background:#fff;border:3px solid #fff;border-radius:99px;box-shadow:inset 0 0 0 2px var(--line)}
  .bar>i{
    display:block;height:100%;width:0;transition:width .4s;border-radius:99px;position:relative;
    background:linear-gradient(90deg,var(--pink),var(--orange),var(--sun),var(--mint),var(--blue),var(--purple));
  }
  .bar>i::after{content:"★";position:absolute;right:-8px;top:-8px;font-size:20px;color:var(--sun);text-shadow:0 0 6px #fff}
  .stats{display:flex;gap:10px;font-weight:700;flex-wrap:wrap;margin:12px 0}
  .stats span{padding:5px 14px;border-radius:99px;background:#fff;box-shadow:0 3px 0 var(--line)}
  .stats span:nth-child(1){color:#8b5cf6}.stats span:nth-child(2){color:#e0388a}.stats span:nth-child(3){color:#e07b00}.stats span:nth-child(4){color:#a1591f}

  .prompt{font-size:clamp(1.3rem,4.8vw,1.8rem);font-weight:600;margin:4px 0 18px;line-height:1.4}
  .prompt b{
    color:#fff;background:linear-gradient(180deg,#b092ff,#8b5cf6);padding:1px 12px;border-radius:14px;white-space:nowrap;
    box-shadow:0 3px 0 #6a3fd6;
  }
  .options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:520px){.options{grid-template-columns:1fr}}
  .options button{
    color:var(--ink);font-size:1.2rem;padding:16px;border-radius:24px;border:3px solid;
  }
  .options button:nth-child(4n+1){background:#ffe6f2;border-color:#ff9ccc;box-shadow:0 5px 0 #ff9ccc}
  .options button:nth-child(4n+2){background:#e3f3ff;border-color:#8fd0fb;box-shadow:0 5px 0 #8fd0fb}
  .options button:nth-child(4n+3){background:#dcfbee;border-color:#7fe0b6;box-shadow:0 5px 0 #7fe0b6}
  .options button:nth-child(4n){background:#fff1cf;border-color:#ffd166;box-shadow:0 5px 0 #ffd166}
  .options button.correct{background:var(--good-l);border-color:var(--good);box-shadow:0 5px 0 var(--good);animation:pop .4s}
  .options button.wrong{background:var(--bad-l);border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:shake .4s}
  .options button:disabled{cursor:default;filter:none;transform:none}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .typebox{display:flex;gap:12px;flex-wrap:wrap}
  .typebox input{
    flex:1 1 220px;font:inherit;font-size:1.3rem;padding:12px 18px;border:3px solid #ffb3d9;border-radius:999px;background:#fff8fc;color:var(--ink);
  }
  .feedback{margin-top:18px;padding:14px 18px;border-radius:24px;display:none;line-height:1.5}
  .feedback.show{display:block;animation:pop .35s}
  .feedback.ok{background:var(--good-l);border:3px solid var(--good)}
  .feedback.no{background:#fff0ea;border:3px solid var(--bad)}
  .fbwrap{display:flex;gap:12px;align-items:center}
  .fbwrap .mascot{animation:none}
  .feedback .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

  .stars{font-size:3.4rem;letter-spacing:8px;color:#e6dcff}
  .stars .on{color:var(--sun);text-shadow:0 0 12px #ffe08a;display:inline-block;animation:starpop .6s both}
  .stars .on:nth-child(2){animation-delay:.2s}.stars .on:nth-child(3){animation-delay:.4s}
  @keyframes starpop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}

  .tabs{display:flex;gap:10px;margin:12px 0}
  .tabs button.active{background:linear-gradient(180deg,#ff8cc4,#ff4f9a);box-shadow:0 5px 0 #d02f78}
  .tabs button:not(.active){background:#fff;color:#8b5cf6;box-shadow:0 5px 0 var(--line)}
  .tip{background:#fff6cf;border:3px dashed #ffd35a;border-radius:24px;padding:12px 18px;margin:12px 0}
  .tip ul{margin:.4em 0 0;padding-left:1.2em}
  .tip li{margin:.3em 0}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
  .grid button{
    color:var(--ink);padding:10px;border-radius:22px;border:3px solid;display:flex;flex-direction:column;gap:1px;align-items:center;
  }
  .grid button .n{font-size:1.5rem;color:#8b5cf6;font-weight:700}
  .grid button .w{font-size:1.02rem;font-weight:600}
  .grid button .c{font-size:.82rem;color:var(--muted);font-weight:500}
  .grid.ords button:nth-child(6n+1){background:#ffe6f2;border-color:#ff9ccc;box-shadow:0 4px 0 #ff9ccc}
  .grid.ords button:nth-child(6n+2){background:#fff1cf;border-color:#ffd166;box-shadow:0 4px 0 #ffd166}
  .grid.ords button:nth-child(6n+3){background:#dcfbee;border-color:#7fe0b6;box-shadow:0 4px 0 #7fe0b6}
  .grid.ords button:nth-child(6n+4){background:#e3f3ff;border-color:#8fd0fb;box-shadow:0 4px 0 #8fd0fb}
  .grid.ords button:nth-child(6n+5){background:#ece4ff;border-color:#b9a0ff;box-shadow:0 4px 0 #b9a0ff}
  .grid.ords button:nth-child(6n){background:#ffe8d8;border-color:#ffb27d;box-shadow:0 4px 0 #ffb27d}
  .grid button.s-winter{background:#e3f4ff;border-color:#8fd0fb;box-shadow:0 4px 0 #8fd0fb}
  .grid button.s-spring{background:#dcfbee;border-color:#7fe0b6;box-shadow:0 4px 0 #7fe0b6}
  .grid button.s-summer{background:#fff1cf;border-color:#ffd166;box-shadow:0 4px 0 #ffd166}
  .grid button.s-autumn{background:#ffe6d3;border-color:#ffab72;box-shadow:0 4px 0 #ffab72}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;font-size:.9rem;font-weight:600}
  .legend span{padding:3px 12px;border-radius:99px;border:2px solid}
  .legend .s-winter{background:#e3f4ff;border-color:#8fd0fb}.legend .s-spring{background:#dcfbee;border-color:#7fe0b6}
  .legend .s-summer{background:#fff1cf;border-color:#ffd166}.legend .s-autumn{background:#ffe6d3;border-color:#ffab72}

  .mistake{padding:8px 0;border-top:2px dotted var(--line)}
  .mistake:first-child{border-top:none}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;top:-16px;width:10px;height:15px;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--rot))}}
  .sr{position:absolute;left:-9999px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
"use strict";

/* ---------- DATA ---------- */
const CARD = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve',
  'thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
function card(n){
  if(n<20) return CARD[n];
  if(n===30) return 'thirty';
  if(n<30) return 'twenty-'+CARD[n-20];
  return 'thirty-'+CARD[n-30];
}
const IRR = {1:'first',2:'second',3:'third',5:'fifth',8:'eighth',9:'ninth',12:'twelfth'};
function ord(n){
  if(n<20) return IRR[n] || CARD[n]+'th';
  if(n===20) return 'twentieth';
  if(n===30) return 'thirtieth';
  return (n<30 ? 'twenty-' : 'thirty-') + ord(n<30 ? n-20 : n-30);
}
function suf(n){
  if(n%100>=11 && n%100<=13) return 'th';
  return ({1:'st',2:'nd',3:'rd'})[n%10] || 'th';
}
function num(n){ return n+suf(n); }

const SK_ORD = [null,'prvý','druhý','tretí','štvrtý','piaty','šiesty','siedmy','ôsmy','deviaty','desiaty',
  'jedenásty','dvanásty','trinásty','štrnásty','pätnásty','šestnásty','sedemnásty','osemnásty','devätnásty',
  'dvadsiaty','dvadsiaty prvý','dvadsiaty druhý','dvadsiaty tretí','dvadsiaty štvrtý','dvadsiaty piaty',
  'dvadsiaty šiesty','dvadsiaty siedmy','dvadsiaty ôsmy','dvadsiaty deviaty','tridsiaty','tridsiaty prvý'];

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ABBR   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
const SK_MON = ['január','február','marec','apríl','máj','jún','júl','august','september','október','november','december'];

function ordTip(n){
  const base = (n>20 && n%10) ? n%10 : n;
  let t;
  if([1,2,3].includes(base)) t = 'Slová <b>first</b>, <b>second</b> a <b>third</b> sú výnimky. Nekončia na -th.';
  else if(base===5)  t = 'Zo slova <b>five</b> sa stane <b>fifth</b> (ve sa zmení na f).';
  else if(base===12) t = 'Zo slova <b>twelve</b> sa stane <b>twelfth</b> (ve sa zmení na f).';
  else if(base===8)  t = 'Zo slova <b>eight</b> sa stane <b>eighth</b> (len jedno t!).';
  else if(base===9)  t = 'Zo slova <b>nine</b> sa stane <b>ninth</b> (e zmizne).';
  else if(base===20 || base===30) t = 'Zo slova <b>twenty</b> sa stane <b>twentieth</b> a z <b>thirty</b> sa stane <b>thirtieth</b> (y sa zmení na ie).';
  else t = 'Väčšina radových čísloviek len pridá -th, napríklad <b>four</b> sa zmení na <b>fourth</b>.';
  if(n>20 && n%10) t += ' Pri číslach ako '+ord(n)+' sa mení iba posledná časť.';
  return t;
}

/* ---------- SMALL HELPERS ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s).toLowerCase().replace(/[\s\-‑–]/g,''); }
const wrap = (n,max) => ((n-1+max)%max)+1;

let settings = { skHints:true, sound:true, name:'' };

/* ---------- COLLECTION (reward system) ---------- */
const PLUSHIES = [
  {e:'🧸', name:'Medvedík'}, {e:'🐰', name:'Zajko'}, {e:'🦊', name:'Líška'},
  {e:'🐼', name:'Pandička'}, {e:'🦄', name:'Jednorožec'}, {e:'🐱', name:'Mačička'},
  {e:'🐶', name:'Psík'}, {e:'🐨', name:'Koalka'}, {e:'🦁', name:'Levík'},
  {e:'🐯', name:'Tigrík'}, {e:'🐸', name:'Žabka'}, {e:'🐷', name:'Prasiatko'},
  {e:'🐵', name:'Opička'}, {e:'🐔', name:'Sliepočka'}, {e:'🐧', name:'Tučniak'},
  {e:'🦉', name:'Sovička'}, {e:'🐺', name:'Vlčiak'}, {e:'🦝', name:'Mýval'},
  {e:'🦔', name:'Ježko'}, {e:'🐹', name:'Škrečok'}, {e:'🐭', name:'Myška'},
  {e:'🦋', name:'Motýlik'}, {e:'🐢', name:'Korytnačka'}, {e:'🐳', name:'Veľrybka'},
  {e:'🐬', name:'Delfínik'}, {e:'🦩', name:'Plameniak'}, {e:'🦥', name:'Lenivec'},
  {e:'🐝', name:'Včielka'}, {e:'🐙', name:'Chobotnička'}, {e:'🦒', name:'Žirafka'}
];
function loadCollection(){
  try{
    const raw = localStorage.getItem('sq_collection');
    if(raw){ const c = JSON.parse(raw); if(c && Array.isArray(c.owned)) return { owned:c.owned, totalCorrect:c.totalCorrect||0, sinceAward:c.sinceAward||0, totalWrong:c.totalWrong||0, totalLost:c.totalLost||0 }; }
  }catch(e){}
  return { owned:[], totalCorrect:0, sinceAward:0, totalWrong:0, totalLost:0 };
}
function saveCollection(){
  try{ localStorage.setItem('sq_collection', JSON.stringify(collection)); }catch(e){}
}
let collection = loadCollection();

/* ---------- HISTORY (for the parent dashboard) ---------- */
function loadHistory(){
  try{
    const raw = localStorage.getItem('sq_history');
    if(raw){ const h = JSON.parse(raw); if(Array.isArray(h)) return h; }
  }catch(e){}
  return [];
}
function saveHistory(){
  try{ localStorage.setItem('sq_history', JSON.stringify(history.slice(-200))); }catch(e){}
}
let history = loadHistory();
function pushHistory(unitId, q, given, ok){
  history.push({ ts: Date.now(), u: unitId, q: String(q.html).replace(/<[^>]+>/g,'').slice(0,90), given: String(given).slice(0,40), ans: String(q.answer).slice(0,40), ok });
  if(history.length>200) history = history.slice(-200);
  saveHistory();
}
const PARENT_PIN = '1234'; // just a kid-deterrent, not real security

/* ---------- SOUND & SPEECH ---------- */
let audioCtx = null;
function beep(ok){
  if(!settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='sine'; o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(880,t+.1); }
    else  { o.frequency.setValueAtTime(220,t); o.frequency.setValueAtTime(180,t+.12); }
    g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.start(t); o.stop(t+.3);
  }catch(e){}
}
function pickVoice(){
  try{
    const voices = speechSynthesis.getVoices();
    if(!voices || !voices.length) return null;
    const score = v => {
      const lang = (v.lang||'').toLowerCase(), name = (v.name||'').toLowerCase();
      let s = 0;
      if(/^en-gb/.test(lang)) s += 100;
      else if(/^en/.test(lang)) s += 40;
      else return -1000; // not English — never pick it
      if(/natural|neural|online|premium|enhanced|google/.test(name)) s += 50;
      if(/desktop|compact|espeak|mobile/.test(name)) s -= 30;
      if(v.localService===false) s += 5; // cloud voices are usually higher quality
      return s;
    };
    let best = null, bestScore = -Infinity;
    voices.forEach(v=>{ const s = score(v); if(s>bestScore){ bestScore=s; best=v; } });
    return bestScore > -1000 ? best : null;
  }catch(e){ return null; }
}
function say(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    u.lang = v ? v.lang : 'en-GB';
    u.rate = .9;
    if(v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- QUESTION BUILDERS ---------- */
function ordDistractors(n){
  const c = ord(n);
  const pool = [card(n), card(n)+'th', ord(n<31?n+1:n-1), ord(n>1?n-1:n+2), ord(n<30?n+2:n-2)];
  const out = [];
  pool.forEach(x=>{ if(x!==c && !out.includes(x)) out.push(x); });
  return out.slice(0,3);
}
function choiceQ(html, correct, distractors, extra){
  const options = shuffle([correct, ...distractors]);
  return Object.assign({ kind:'choice', html, options, answer:correct }, extra);
}

const BUILD = {
  ordToWord(max){
    const n = rnd(1,max);
    return choiceQ(`Ktoré slovo sedí k <b>${num(n)}</b>?`, ord(n), ordDistractors(n),
      { say: ord(n), explain:`${num(n)} = <b>${ord(n)}</b> (po slovensky ${SK_ORD[n]}). ${ordTip(n)}` });
  },
  wordToOrd(max){
    const n = rnd(1,max);
    const pool = [String(n), num(n<max?n+1:n-1), num(n>1?n-1:n+2), num(n+10<=31?n+10:Math.max(1,n-10))];
    const correct = num(n), d = [];
    pool.forEach(x=>{ if(x!==correct && !d.includes(x)) d.push(x); });
    while(d.length<3){ const x = num(rnd(1,max)); if(x!==correct && !d.includes(x)) d.push(x); }
    return choiceQ(`Ktoré číslo sedí k <b>${ord(n)}</b>?`, correct, d.slice(0,3),
      { say: ord(n), explain:`<b>${ord(n)}</b> (${SK_ORD[n]}) sa píše <b>${num(n)}</b>. Radová číslovka v angličtine končí na st, nd, rd alebo th.` });
  },
  typeOrd(max){
    const n = rnd(1,max);
    return { kind:'type', html:`Napíš to slovom: <b>${num(n)}</b>`, answer: ord(n), placeholder:'napr. fourth',
      say: ord(n), explain:`${num(n)} = <b>${ord(n)}</b> (po slovensky ${SK_ORD[n]}). ${ordTip(n)}` };
  },
  sequence(max){
    const top = Math.max(4,max);
    const n = rnd(1,top-3);
    const a = n+3;
    return choiceQ(`Čo je ďalej?<br><b>${ord(n)}, ${ord(n+1)}, ${ord(n+2)}, …</b>`, ord(a), ordDistractors(a),
      { say: ord(a), explain:`Ďalšia radová číslovka je <b>${ord(a)}</b> (${num(a)}, po slovensky ${SK_ORD[a]}). ${ordTip(a)}` });
  },
  numToMonth(){
    const m = rnd(1,12);
    const d = shuffle(MONTHS.filter((_,i)=>i!==m-1)).slice(0,3);
    return choiceQ(`Ktorý mesiac je <b>${num(m)}</b> mesiacom v roku?`, MONTHS[m-1], d,
      { say: MONTHS[m-1], explain:`<b>${ord(m)}</b> mesiac v roku je <b>${MONTHS[m-1]}</b> (${SK_MON[m-1]}). Mesiace sa v angličtine vždy píšu s veľkým začiatočným písmenom.` });
  },
  monthToNum(){
    const m = rnd(1,12);
    const pool = [num(wrap(m+1,12)), num(wrap(m-1,12)), num(wrap(m+2,12)), num(wrap(m-2,12)), num(wrap(m+3,12))];
    const d = pool.filter((x,i)=>x!==num(m) && pool.indexOf(x)===i).slice(0,3);
    return choiceQ(`<b>${MONTHS[m-1]}</b> je ktorý mesiac v roku?`, num(m), d,
      { say: MONTHS[m-1]+', the '+ord(m)+' month', explain:`<b>${MONTHS[m-1]}</b> (${SK_MON[m-1]}) je <b>${ord(m)}</b> mesiac v roku (${num(m)}).` });
  },
  czMonth(){
    const m = rnd(1,12);
    const d = shuffle(MONTHS.filter((_,i)=>i!==m-1)).slice(0,3);
    return choiceQ(`Ako sa po anglicky povie <b>${SK_MON[m-1]}</b>?`, MONTHS[m-1], d,
      { say: MONTHS[m-1], explain:`${SK_MON[m-1]} sa po anglicky povie <b>${MONTHS[m-1]}</b>. Je to <b>${ord(m)}</b> mesiac v roku.` });
  },
  typeMonth(){
    const m = rnd(1,12);
    return { kind:'type', month:true, html:`Napíš mesiac po anglicky: <b>${SK_MON[m-1]}</b>`, answer: MONTHS[m-1], placeholder:'po anglicky',
      say: MONTHS[m-1], explain:`${SK_MON[m-1]} sa po anglicky píše <b>${MONTHS[m-1]}</b>. Nezabudni na veľké začiatočné písmeno!` };
  },
  nextMonth(){
    const m = rnd(1,12), after = Math.random()<.5;
    const t = wrap(after ? m+1 : m-1, 12);
    const d = shuffle(MONTHS.filter((_,i)=>i!==t-1)).slice(0,3);
    return choiceQ(`Ktorý mesiac je <b>${after?'po':'pred'}</b> mesiacom ${MONTHS[m-1]}?`, MONTHS[t-1], d,
      { say: MONTHS[t-1], explain:`Mesiac ${after?'po':'pred'} ${MONTHS[m-1]} (${SK_MON[m-1]}) je <b>${MONTHS[t-1]}</b> (${SK_MON[t-1]}).` });
  },
  date(){
    const d = rnd(1,28), m = rnd(1,12);
    const M = MONTHS[m-1];
    const correct = `the ${ord(d)} of ${M}`;
    const cand = [
      `the ${ord(d<28?d+1:d-1)} of ${M}`,
      `the ${ord(d)} of ${MONTHS[wrap(m+1,12)-1]}`,
      `the ${card(d)} of ${M}`,
      `the ${ord(d>1?d-1:d+2)} of ${M}`
    ];
    const dd = []; cand.forEach(x=>{ if(x!==correct && !dd.includes(x)) dd.push(x); });
    return choiceQ(`Vo Veľkej Británii sa najprv píše <u>deň</u>. Ako povieme <b>${d}/${m}</b>?`, correct, dd.slice(0,3),
      { say: correct, explain:`${d}/${m} sa po anglicky povie <b>${correct}</b> (teda ${num(d)} ${M}). Vo Veľkej Británii sa najprv píše deň, v USA najprv mesiac.` });
  },
  dateReverse(){
    const d = rnd(1,28), m = rnd(1,12);
    const M = MONTHS[m-1];
    const phrase = `the ${ord(d)} of ${M}`;
    const correct = `${d}/${m}`;
    const cand = [`${d<28?d+1:d-1}/${m}`, `${d}/${wrap(m+1,12)}`, `${d>1?d-1:d+2}/${m}`, `${d}/${wrap(m-1,12)}`];
    const dd = []; cand.forEach(x=>{ if(x!==correct && !dd.includes(x)) dd.push(x); });
    return choiceQ(`Ktorý dátum znamená <b>${phrase}</b>?`, correct, dd.slice(0,3),
      { say: phrase, explain:`<b>${phrase}</b> zapíšeme ako <b>${correct}</b> (deň/mesiac). Vo Veľkej Británii sa najprv píše deň.` });
  },
  season(){
    const m = rnd(1,12);
    const s = SEASON[m-1];
    const skNames = {winter:'zima', spring:'jar', summer:'leto', autumn:'jeseň'};
    const opts = ['winter','spring','summer','autumn'];
    const d = shuffle(opts.filter(x=>x!==s)).slice(0,3);
    return choiceQ(`Aké je ročné obdobie mesiaca <b>${MONTHS[m-1]}</b>?`, s, d,
      { say: s, explain:`<b>${MONTHS[m-1]}</b> (${SK_MON[m-1]}) patrí do obdobia <b>${s}</b> (po slovensky ${skNames[s]}).` });
  },
  beforeOrd(max){
    const n = rnd(2,max);
    const b = n-1;
    return choiceQ(`Čo je hneď pred <b>${ord(n)}</b>?`, ord(b), ordDistractors(b),
      { say: ord(b), explain:`Pred <b>${ord(n)}</b> je <b>${ord(b)}</b> (${num(b)}, po slovensky ${SK_ORD[b]}). ${ordTip(b)}` });
  },
  spellTrap(max){
    const pool = []; for(let n=1;n<=max;n++){ if(ord(n)!==card(n)+'th') pool.push(n); }
    const n = pool.length ? pick(pool) : rnd(1,max);
    const c = ord(n), wrong = card(n)+'th';
    let opts = [c, wrong];
    ordDistractors(n).forEach(x=>{ if(opts.length<4 && !opts.includes(x)) opts.push(x); });
    while(opts.length<4){ const x = ord(rnd(1,max)); if(!opts.includes(x)) opts.push(x); }
    return { kind:'choice', html:`⚠️ Pozor, zákerná otázka! Ako sa <b>správne</b> píše <b>${num(n)}</b>?`,
      options: shuffle(opts.slice(0,4)), answer:c,
      say:c, explain:`Správne je <b>${c}</b>, nie „${wrong}“! ${ordTip(n)}` };
  },
  monthSpellTrap(){
    const traps = {'February':'Febuary','August':'Augest','September':'Septembr','November':'Novembr','December':'Decembr'};
    const keys = Object.keys(traps);
    const m = pick(keys), wrong = traps[m];
    let opts = [m, wrong];
    shuffle(MONTHS.filter(x=>x!==m)).slice(0,2).forEach(x=>{ if(opts.length<4) opts.push(x); });
    return { kind:'choice', html:`⚠️ Pozor, zákerná otázka! Ako sa <b>správne</b> píše po anglicky mesiac <b>${SK_MON[MONTHS.indexOf(m)]}</b>?`,
      options: shuffle(opts.slice(0,4)), answer:m,
      say:m, explain:`Správne je <b>${m}</b>, nie „${wrong}“! Tento mesiac sa často píše nesprávne.` };
  }
};

const LEVELS = {
  1:{ name:'Úroveň 1 – Začiatočník', max:12, types:['ordToWord','wordToOrd','numToMonth','monthToNum','czMonth','nextMonth','typeOrd','season'] },
  2:{ name:'Úroveň 2 – Objaviteľ', max:31, types:['ordToWord','wordToOrd','typeOrd','sequence','beforeOrd','czMonth','typeMonth','nextMonth','date','season','spellTrap','monthSpellTrap'] },
  3:{ name:'Úroveň 3 – Šampión', max:31, types:['typeOrd','typeMonth','date','dateReverse','sequence','beforeOrd','ordToWord','monthToNum','season','spellTrap','monthSpellTrap'] },
  4:{ name:'Úroveň 4 – Majster', max:31, types:['typeOrd','typeMonth','date','dateReverse','sequence','beforeOrd','czMonth','monthToNum','wordToOrd','season','nextMonth','spellTrap','monthSpellTrap'] }
};
function makeRound(level){
  const L = LEVELS[level], qs = [], seen = new Set();
  let guard = 0;
  while(qs.length<20 && guard++<400){
    const q = BUILD[pick(L.types)](L.max);
    if(seen.has(q.html)) continue;
    seen.add(q.html); qs.push(q);
  }
  return qs;
}

  return { kind:'choice', html:`⚠️ Pozor, zákerná otázka! Aký je <b>správny</b> minulý čas slovesa <b>to ${v}</b>?`,
    options: shuffle([correct, wrong, ...filler]), answer: correct,
    say: correct, explain:`Správne je <b>${correct}</b>, nie „${wrong}“! to ${v} je nepravidelné sloveso — nepridáva sa -ed.` };
}

/* --- Chapter 4: countable / uncountable --- */
const U4_COUNTABLE = [['an egg','vajce'],['a sausage','klobása'],['a tomato','paradajka'],['a banana','banán'],
  ['a carrot','mrkva'],['an onion','cibuľa'],['a potato','zemiak'],['a mushroom','huba'],['a lemon','citrón']];
const U4_UNCOUNTABLE = [['rice','ryža'],['cheese','syr'],['milk','mlieko'],['water','voda'],['bread','chlieb'],
  ['butter','maslo'],['sugar','cukor'],['salt','soľ'],['pepper','korenie'],['wine','víno'],['tea','čaj'],['coffee','káva'],['pasta','cestoviny']];
function u4Grammar(){
  const countable = Math.random()<.5;
  const it = countable ? pick(U4_COUNTABLE) : pick(U4_UNCOUNTABLE);
  const word = countable ? it[0].replace(/^(a|an) /,'')+'s' : it[0];
  const correct = countable ? 'How many' : 'How much';
  return choiceQ(`___ ${word} have you got? (${it[1]})`, correct, ['How much','How many','How old','How long'].filter(x=>x!==correct).slice(0,3),
    { say: correct+' '+word, explain:`<b>${word}</b> (${it[1]}) je ${countable?'počítateľné, preto sa pýtame <b>How many</b>':'nepočítateľné, preto sa pýtame <b>How much</b>'}.` });
}
function u4Trap(){
  const countable = Math.random()<.5;
  if(countable){
    const it = pick(U4_COUNTABLE);
    const [article, noun] = it[0].split(' ');
    const wrong = article==='an' ? 'a '+noun : 'an '+noun;
    return { kind:'choice', html:`⚠️ Pozor, zákerná otázka! Ktorý člen je správny? ___ ${noun} (${it[1]})`,
      options: shuffle([it[0], wrong, 'some '+noun, 'any '+noun]), answer: it[0],
      say: it[0], explain:`Správne je <b>${it[0]}</b>! Člen <b>an</b> sa používa pred slovom, ktoré začína samohláskou (a, e, i, o, u).` };
  } else {
    const it = pick(U4_UNCOUNTABLE);
    return { kind:'choice', html:`⚠️ Pozor, zákerná otázka! Čo je správne? ___ ${it[0]} (${it[1]})`,
      options: shuffle(['some '+it[0], 'a '+it[0], 'many '+it[0], 'an '+it[0]]), answer: 'some '+it[0],
      say: 'some '+it[0], explain:`Správne je <b>some ${it[0]}</b>! Nepočítateľné podstatné mená nemajú člen a/an, používame <b>some</b>.` };
  }
}

/* --- Chapter 5: comparatives --- */
const U5_ADJ = { hot:['hotter','hoter','horúci'], big:['bigger','biger','veľký'], nice:['nicer','niceer','pekný'],
  dry:['drier','dryer','suchý'], happy:['happier','happyer','šťastný'], sunny:['sunnier','sunnyer','slnečný'],
  wet:['wetter','weter','mokrý'], crowded:['more crowded','crowdeder','preplnený'],
  beautiful:['more beautiful','beautifuller','krásny'], expensive:['more expensive','expensiver','drahý'] };
const U5_HOW = { mountain:'high', lake:'wide', river:'long', valley:'deep' };
function u5Grammar(){
  const place = pick(Object.keys(U5_HOW)), correct = U5_HOW[place];
  return choiceQ(`___ is that ${place}?`, correct, Object.values(U5_HOW).filter(x=>x!==correct),
    { say:`How ${correct} is that ${place}`, explain:`Pri ${place==='mountain'?'hore':place==='lake'?'jazere':place==='river'?'rieke':'údolí'} sa pýtame <b>How ${correct}</b>.` });
}
function u5Trap(){
  const keys = Object.keys(U5_ADJ);
  const adj = pick(keys), [correct, wrong] = U5_ADJ[adj];
  const filler = shuffle(keys.filter(x=>x!==adj)).slice(0,2).map(x=>U5_ADJ[x][0]);
  return { kind:'choice', html:`⚠️ Pozor, zákerná otázka! Aký je <b>správny</b> tvar 2. stupňa (comparative) slova <b>${adj}</b> (${U5_ADJ[adj][2]})?`,
    options: shuffle([correct, wrong, ...filler]), answer: correct,
    say: correct, explain:`Správne je <b>${correct}</b>, nie „${wrong}“!` };
}

/* --- Chapter 6: going to / have to --- */
const U6_PLANS = [['watch TV','pozerať telku'],['play football','hrať futbal'],['visit grandma','navštíviť babku'],['do homework','robiť domáce úlohy'],['watch a film','pozerať film']];
function u6Grammar(){
  const n = pick(U0_NAMES), p = pick(U6_PLANS);
  const correct = 'is going to '+p[0];
  return choiceQ(`Zajtra ${n} ${p[1]}. Doplň: <b>Tomorrow ${n} ___ .</b>`, correct, [p[0], p[0]+'s', 'was going to '+p[0]],
    { say:`${n} ${correct}`, explain:`Pre plány do budúcnosti používame <b>is/am/are going to</b> + sloveso: <b>${correct}</b>.` });
}
function u6Trap(){
  const third = Math.random()<.5;
  const subj = third ? pick(['He','She','Laura','Oscar']) : pick(['I','You','We','They']);
  const correct = third ? 'has to' : 'have to';
  const wrong = third ? 'have to' : 'has to';
  return { kind:'choice', html:`⚠️ Pozor, zákerná otázka! <b>${subj} ___ get up early tomorrow.</b> Čo je správne?`,
    options: shuffle([correct, wrong, 'having to', "hasn't to"]), answer: correct,
    say:`${subj} ${correct} get up early`, explain:`Pri <b>${subj}</b> je správne <b>${correct}</b>. He/She/It používa <b>has to</b>, ostatné osoby <b>have to</b>.` };
}

const UNIT_BUILD = {
  0:{ vocab:()=>vocabChoice(0), word:()=>vocabType(0), grammar:u0Grammar, trap:u0Trap },
  2:{ vocab:()=>vocabChoice(2), word:()=>vocabType(2), grammar:u2Grammar, trap:u2Trap },
  3:{ vocab:()=>vocabChoice(3), word:()=>vocabType(3), grammar:u3Grammar, trap:u3Trap },
  4:{ vocab:()=>vocabChoice(4), word:()=>vocabType(4), grammar:u4Grammar, trap:u4Trap },
  5:{ vocab:()=>vocabChoice(5), word:()=>vocabType(5), grammar:u5Grammar, trap:u5Trap },
  6:{ vocab:()=>vocabChoice(6), word:()=>vocabType(6), grammar:u6Grammar, trap:u6Trap }
};
function makeUnitRound(id){
  const gens = UNIT_BUILD[id], keys = Object.keys(gens);
  const qs = [], seen = new Set();
  let guard = 0;
  while(qs.length<16 && guard++<300){
    const q = gens[pick(keys)]();
    if(seen.has(q.html)) continue;
    seen.add(q.html); qs.push(q);
  }
  return qs;
}
function unitStats(id){
  const rows = history.filter(h=>String(h.u)===String(id));
  if(!rows.length) return null;
  const r = rows.filter(h=>h.ok).length, t = rows.length;
  return { r, t, pct: Math.round(r/t*100) };
}
function unitLabel(id){ return id==1 ? '1. Môj život' : (UNITS[id]?UNITS[id].title:('Kapitola '+id)); }

function decorate(){
  const sym = ['✦','♥','✿','★','✧'];
  let h = '';
  for(let i=0;i<18;i++){
    h += `<span style="left:${rnd(0,96)}%;top:${rnd(0,94)}%;font-size:${rnd(16,40)}px;color:${COLS[i%COLS.length]};animation-delay:-${(Math.random()*8).toFixed(1)}s;animation-duration:${rnd(6,12)}s">${sym[i%sym.length]}</span>`;
  }
  $('#bg').innerHTML = h;
}
function burst(n){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  for(let i=0;i<n;i++){
    const c = document.createElement('i');
    c.style.left = rnd(3,97)+'%';
    c.style.background = pick(COLS);
    c.style.setProperty('--dx', rnd(-120,120)+'px');
    c.style.setProperty('--rot', rnd(240,900)+'deg');
    c.style.animationDuration = (1.2+Math.random()*1.2)+'s';
    c.style.animationDelay = (Math.random()*.3)+'s';
    if(i%3===0) c.style.borderRadius = '50%';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 2900);
}

function question(){

  } else {
    input = `<div class="typebox">
      <input id="ans" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${esc(q.placeholder||'')}" aria-label="Tvoja odpoveď">
      <button id="check">Skontroluj</button></div>`;
  }
  app.innerHTML = `
    ${header()}
    <div class="top"><h2>${esc(S.levelName)}</h2><button class="ghost small" id="quit">Skončiť</button></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.qs.length}" aria-valuenow="${S.i}"><i style="width:${Math.max(pct,4)}%"></i></div>
    <div class="stats"><span>Otázka ${S.i+1} / ${S.qs.length}</span><span>Skóre ${S.score}</span><span>Séria ${S.streak}</span><span>🧸 ${collection.owned.length}/${PLUSHIES.length}</span></div>
    <div class="card">
      <div class="prompt">${q.html}</div>
      ${input}
      <div class="feedback" id="fb"></div>
    </div>`;
  bindHeader();
  $('#quit').onclick = home;
  if(q.kind==='choice'){
    app.querySelectorAll('.options button').forEach(b => b.onclick = () => answer(q, q.options[+b.dataset.i], b));
  } else {
    const inp = $('#ans');
    inp.focus();
    inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); if(!q.answered) answer(q, inp.value); } };
    $('#check').onclick = () => { if(!q.answered) answer(q, inp.value); };
  }
}

function answer(q, given, btn){
  if(q.answered) return;
  if(q.kind==='type' && !String(given).trim()) return;
  q.answered = true;
  let ok, capNote = '';
  if(q.kind==='choice'){
    ok = given === q.answer;
  } else {
    ok = norm(given) === norm(q.answer);
    if(ok && q.month && String(given).trim()[0] !== q.answer[0]) capNote = ' Super! Nabudúce použi veľké písmeno: <b>'+esc(q.answer)+'</b>.';
  }
  let newPlush = null, lostPlush = null;
  if(ok){
    S.score += 10 + Math.min(S.streak,5)*2; S.streak++; S.right++; S.best = Math.max(S.best,S.streak);
    S.missStreak = 0;
    collection.totalCorrect++;
    collection.sinceAward++;
    if(collection.owned.length < PLUSHIES.length && collection.sinceAward>=3 && Math.random()<0.3){
      const avail = PLUSHIES.map((_,i)=>i).filter(i=>!collection.owned.includes(i));
      const idx = pick(avail);
      collection.owned.push(idx);
      collection.sinceAward = 0;
      newPlush = PLUSHIES[idx];
    }
    saveCollection();
  } else {
    S.streak = 0; if(!S.wrong.includes(q)) S.wrong.push(q);
    S.missStreak = (S.missStreak||0) + 1;
    collection.totalWrong = (collection.totalWrong||0) + 1;
    if(S.missStreak>=3 && collection.owned.length>0){
      const idx = pick(collection.owned.slice());
      collection.owned = collection.owned.filter(i=>i!==idx);
      collection.sinceAward = 0;
      collection.totalLost = (collection.totalLost||0) + 1;
      S.missStreak = 0;
      lostPlush = PLUSHIES[idx];
    }
    saveCollection();
  }
  pushHistory(S.unitId, q, given, ok);
  beep(ok);
  if(ok) burst(newPlush ? 70 : (S.streak>=3 ? 40 : 22));

  if(q.kind==='choice'){
    app.querySelectorAll('.options button').forEach((b,i)=>{
      b.disabled = true;
      if(q.options[i]===q.answer) b.classList.add('correct');
      else if(b===btn) b.classList.add('wrong');
    });
  } else {
    $('#ans').disabled = true; $('#check').disabled = true;
  }
  const last = S.i === S.qs.length-1;
  const plushHtml = newPlush ? `<div class="card" style="margin-top:14px;text-align:center;background:linear-gradient(180deg,#fff6cf,#ffe6f2);border:3px dashed #ffb81f">
      <div style="font-size:3rem;line-height:1">${newPlush.e}</div>
      <b>Nová plyšová kamarátka: ${esc(newPlush.name)}!</b><br>
      <span class="muted">Zbierka: ${collection.owned.length} / ${PLUSHIES.length}</span>
    </div>` : '';
  const lostHtml = lostPlush ? `<div class="card" style="margin-top:14px;text-align:center;background:linear-gradient(180deg,#ffe0d9,#fff0ea);border:3px dashed #ff7a59">
      <div style="font-size:3rem;line-height:1;opacity:.5">${lostPlush.e}</div>
      <b>Jaj, ${esc(lostPlush.name)} ti odbehla!</b><br>
      <span class="muted">Tri chyby za sebou stoja plyšáka. Premýšľaj, nehádaj! Zbierka: ${collection.owned.length} / ${PLUSHIES.length}</span>
    </div>` : '';
  const fb = $('#fb');
  fb.className = 'feedback show ' + (ok?'ok':'no');
  fb.innerHTML = `<div class="fbwrap">${mascot(ok?'cheer':'oops',64)}<div><b>${ok?pick(PRAISE):pick(OOPS)}</b>${capNote}<br>${q.explain}</div></div>
    ${plushHtml}${lostHtml}
    <div class="row">
      <button class="ghost small" id="hear">Vypočuť</button>
      <button class="small" id="next">${last?'Zobraziť výsledky':'Ďalej'}</button>
    </div>`;
  $('#hear').onclick = () => say(q.say);
  $('#next').onclick = next;
  $('#next').focus();
  $('#live').textContent = ok ? 'Správne' : 'Nie celkom. Správna odpoveď je ' + q.answer;
}

function next(){
  S.i++;
  if(S.i >= S.qs.length) results(); else question();
}

function results(){
  const total = S.qs.length;
  const stars = S.right>=total-1 ? 3 : S.right>=Math.ceil(total*.7) ? 2 : S.right>=Math.ceil(total*.5) ? 1 : 0;
  const nm = settings.name ? ', ' + esc(settings.name) : '';
  const msg = stars===3 ? `Skvelé${nm}! Skoro dokonalé.` :
              stars===2 ? `Výborne${nm}! Pokračuj v cvičení.` :
              stars===1 ? `Dobrý pokus${nm}! Skús to ešte raz.` :
                          `Neboj sa${nm}. Pozri si kartičky v Učení a skús to znova.`;
  const mistakes = S.wrong.map(q => `<div class="mistake">${q.html.replace(/<br>/g,' ')}<br>Odpoveď: <b>${esc(q.answer)}</b></div>`).join('');
  app.innerHTML = `
    ${header()}
    <h1>Výsledky</h1>
    <div class="card" style="text-align:center">
      ${mascot(stars>=2?'cheer':'happy',96)}
      <div class="stars" aria-label="${stars} z 3 hviezdičiek">
        ${[1,2,3].map(n=>`<span class="${n<=stars?'on':''}">★</span>`).join('')}
      </div>
      <p><b>${S.right} / ${total}</b> správne · Skóre <b>${S.score}</b> · Najlepšia séria <b>${S.best}</b></p>
      <p>${msg}</p>
    </div>
    ${S.wrong.length ? `<div class="card"><h2>Poďme si precvičiť tieto</h2>${mistakes}</div>` : ''}
    <div class="menu">
      <button class="m2" id="again">Hrať znova<small>Nové otázky, rovnaká kapitola</small></button>
      ${S.wrong.length ? `<button class="m1" id="prac">Precvičiť chyby<small>Skús si ${S.wrong.length} ${S.wrong.length===1?'ťažkú otázku':(S.wrong.length<5?'ťažké otázky':'ťažkých otázok')} znova</small></button>` : ''}
      ${(S.unitId===1 && S.level<4) ? `<button class="m4" id="up">Skús ${LEVELS[S.level+1].name}<small>O trochu ťažšie</small></button>` : ''}
      <button class="ghost" id="coll">🧸 Moja zbierka<small>${collection.owned.length} / ${PLUSHIES.length} plyšákov</small></button>
      <button class="ghost" id="hm">Domov</button>
    </div>`;
  bindHeader();
  if(stars>=2) burst(70);
  const isU1 = S.unitId===1, lv = S.level, uid = S.unitId, wr = S.wrong.slice();
  $('#again').onclick = () => isU1 ? start(lv) : startUnit(uid);
  if($('#prac')) $('#prac').onclick = () => { const q = shuffle(wr).map(q=>Object.assign({}, q, {answered:false})); isU1 ? start(lv, q) : startUnit(uid, q); };
  if($('#up')) $('#up').onclick = () => start(lv+1);
  $('#coll').onclick = collectionScreen;
  $('#hm').onclick = home;
}

function collectionScreen(){
  const total = PLUSHIES.length;
  const items = PLUSHIES.map((p,i)=>{
    const owned = collection.owned.includes(i);
    return `<div class="card" style="text-align:center;padding:16px;margin:0${owned?'':';filter:grayscale(1);opacity:.4'}">
      <div style="font-size:2.6rem;line-height:1">${owned?p.e:'❔'}</div>
      <div style="font-weight:700;margin-top:6px;font-size:.95rem">${owned?esc(p.name):'???'}</div>
    </div>`;
  }).join('');
  app.innerHTML = `
    ${header()}
    <div class="top"><h2>Moja zbierka plyšákov</h2><button class="ghost small" id="back">← Domov</button></div>
    <p class="muted">Nazbierala si <b>${collection.owned.length} / ${total}</b> plyšových kamarátov. Za každé 3 správne odpovede získaš nového!</p>
    <div class="grid">${items}</div>`;
  bindHeader();
  $('#back').onclick = home;
}

decorate();
home();
</script>
</body>
</html>
